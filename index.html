<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Geometry Rush</title>
<style>
:root{--bg:#070914;--fg:#fff;--ac:#2de2e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3cqw;background:rgba(5,6,22,.78);font-size:max(2cqw,11px);text-align:center}
.hid{display:none!important}
h1{font-size:6.4cqw;margin:0;font-weight:900;letter-spacing:.3cqw;text-shadow:0 0 2cqw var(--ac)}
h2{font-size:3.6cqw;margin:0}p{margin:0;opacity:.75}
button{font:inherit;color:#fff;background:#1a1f55;border:.2cqw solid var(--ac);border-radius:1cqw;padding:.8cqw 2cqw;cursor:pointer}
button:hover,button:focus-visible{background:#2b33a0;outline:none}
.lv{display:flex;gap:1.6cqw}.lv button{width:20cqw;padding:1.4cqw;line-height:1.5}
.lv b{display:block;font-size:2.6cqw}
.sw{display:flex;gap:.6cqw;align-items:center}
.sw i{width:3cqw;height:3cqw;border-radius:.5cqw;border:.25cqw solid transparent;cursor:pointer}
.sw i.on,.sw canvas.on{border-color:#fff}
.sw canvas{width:5cqw;height:5cqw;border:.25cqw solid #456;border-radius:.6cqw;cursor:pointer;background:#10143a}
.row{display:flex;gap:1.2cqw;align-items:center}
#pv{width:48cqw;height:11cqw;background:#10143a;border-radius:1cqw}
#bx{position:absolute;top:1cqw;right:1cqw;padding:.4cqw 1.2cqw}
</style></head><body>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<button id="bx" class="hid" aria-label="Меню">☰</button>
<div id="menu" class="ov">
<h1>GEOMETRY RUSH</h1>
<div class="lv" id="lv"></div>
<div class="row"><button id="bc">Кастомизация</button><button id="bm">Звук: вкл</button></div>
<p>Пробел, клик или касание: прыжок, подъём, смена направления. Esc: меню.</p>
</div>
<div id="cust" class="ov hid">
<h2>Кастомизация</h2>
<canvas id="pv" width="480" height="110"></canvas>
<p id="cm"></p>
<div class="row">Иконка <div class="sw" id="ig"></div></div>
<div class="row">Основной цвет <div class="sw" id="s1"></div></div>
<div class="row">Доп. цвет <div class="sw" id="s2"></div></div>
<div class="row">Цвет следа <div class="sw" id="s3"></div></div>
<button id="bk">Сохранить и выйти</button>
</div>
<div id="end" class="ov hid">
<h1>Уровень пройден!</h1><p id="et"></p>
<div class="row"><button id="bn">Меню</button><button id="br">Ещё раз</button></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),W=800,H=450,FY=360,T=40,SP=400;
const COLS=['#2de2e6','#ffe600','#39ff14','#ff2d95','#ff7a00','#a259ff','#ffffff','#2d6bff','#ff3030','#00ffb3'];
const PC={cube:'#2d6bff',ship:'#ff2d95',wave:'#39ff14',swing:'#ffe600'},PN={cube:'КУБ',ship:'КОРАБЛЬ',wave:'ВОЛНА',swing:'КОПТЕР'};
let S={ic:0,c1:0,c2:3,tr:1,best:[0,0,0],mute:0,cl:[[0,0,0],[0,0,0],[0,0,0]]};
try{Object.assign(S,JSON.parse(localStorage.getItem('gr')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gr',JSON.stringify(S))}catch(e){}};
const NEED=[0,0,0,0,0,0,3,6,9],tot=()=>S.cl.flat().reduce((a,b)=>a+b,0);
const MIN=[0,2,3,5,7,8,10];
const LV=[
{name:'Neon Dawn',star:'★☆☆',bg:['#0c1a66','#2a9bff'],gr:'#091244',blk:'#0e2a8a',acc:'#2de2e6',gap:[8,11],tg:{ship:6,wave:5,swing:6},seed:7,cs:[2,3,6],
 secs:[['cube',60],['ship',50],['cube',40],['wave',45],['cube',30],['swing',45],['cube',35]],
 m:{bpm:128,root:57,sc:MIN,prog:[0,5,2,6],k:'x...x...x...x...',b:'x.x.x.x.x.x.x.xx',l:['0.2.4.2.7.4.2.4.','4.2.0.2.4.7.9.7.']}},
{name:'Cyber Pulse',star:'★★☆',bg:['#2a0a5e','#e03a9a'],gr:'#1a0640',blk:'#44109a',acc:'#ff2d95',gap:[6,9],tg:{ship:5,wave:5,swing:5},seed:21,cs:[2,4,6],
 secs:[['cube',50],['wave',50],['cube',40],['ship',55],['swing',50],['cube',40],['wave',45],['cube',30]],
 m:{bpm:140,root:50,sc:MIN,prog:[0,0,5,6],k:'x...x..xx...x...',b:'xx.xx.xxxx.xx.xx',l:['0.7.0.7.5.4.2.4.','9.7.5.7.4.2.0.2.']}},
{name:'Inferno Drive',star:'★★★',bg:['#4a0600','#ff7a00'],gr:'#2a0300',blk:'#8a1a00',acc:'#ffe600',gap:[5,7],tg:{ship:4,wave:4,swing:5},seed:99,cs:[1,4,6],
 secs:[['cube',50],['ship',55],['swing',55],['cube',40],['wave',60],['swing',45],['cube',40],['ship',40],['cube',30]],
 m:{bpm:152,root:52,sc:[0,1,3,5,7,8,10],prog:[0,1,0,6],k:'x.x.x.x.x.x.x.xx',b:'xxxxxxxxxxxxxxxx',l:['0.3.5.3.7.5.3.1.','4.5.7.9.7.5.4.3.']}}];
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function build(L){
 const r=rng(L.seed),o=[];let x=14,sI=-1;
 const sp=x=>o.push({t:'s',x:x*T,y:8*T}),bl=(x,row,w,h)=>h>0&&o.push({t:'b',x:x*T,y:row*T,w:w*T,h:h*T});
 for(const[m,len]of L.secs){
  o.push({t:'p',x:x*T,m});const end=x+len;x+=6;sI++;const ci=L.cs.indexOf(sI);
  if(m=='cube'){
   if(ci>=0){bl(x+3,8,1,1);o.push({t:'c',x:(x+4)*T+110,y:200,i:ci});x+=12}
   while(x<end-8){
    const k=r()*5|0;
    if(k==0){sp(x);x+=1}else if(k==1){sp(x);sp(x+1);x+=2}else if(k==2){sp(x);sp(x+1);sp(x+2);x+=3}
    else if(k==3){bl(x,8,1,1);sp(x+2);sp(x+3);x+=4}else{bl(x,8,3,1);sp(x+3);x+=4}
    x+=L.gap[0]+(r()*(L.gap[1]-L.gap[0])|0);
   }
  }else{
   let nk=x+(len>>1);const gap=L.tg[m],amp=(9-gap)/2-.5,ph=r()*6,f=m=='swing'?.15+r()*.1:.22+r()*.1;
   for(let i=x;i<end-4;i++){
    const c=4.5+amp*Math.sin(ph+(i-x)*f)*Math.min(1,(i-x)/8),top=Math.round(c-gap/2);
    let tp=top;if(ci>=0&&i>=nk&&i<nk+3&&top>=1){tp=top-1;if(i==nk)o.push({t:'c',x:i*T+T/2,y:tp*T+T/2,i:ci})}else if(ci>=0&&i==nk)nk++;bl(i,0,1,tp);bl(i,top+gap,1,9-top-gap);
   }
  }
  x=end;
 }
 o.push({t:'f',x:(x+6)*T});L.len=(x+6)*T;return o;
}
let O=[],P,lvl=0,mode='cube',state='menu',att=0,dead=0,parts=[],NOW=0,acc=0,last=0;
const sz=()=>mode=='wave'?12:mode=='swing'?24:mode=='ship'?26:34,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function setMode(m){mode=m;P.vy=0;P.dir=1;P.rot=0;P.trail=[]}
function start(){O.forEach(q=>q.d=0);P={x:0,y:FY-17,vy:0,rot:0,dir:1,hold:false,on:true,trail:[]};mode='cube';parts=[];att++;state='play';music(true)}
function openLv(i){lvl=i;O=build(LV[i]);att=0;['menu','cust','end'].forEach(n=>$(n).classList.add('hid'));$('bx').classList.remove('hid');start()}
function toMenu(){state='menu';music(false);['cust','end','bx'].forEach(n=>$(n).classList.add('hid'));$('menu').classList.remove('hid');renderMenu()}
function renderMenu(){const e=$('lv');e.innerHTML='';LV.forEach((L,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${L.name}</b>${L.star}<br>Рекорд: ${S.best[i]|0}%<br>Монеты: ${S.cl[i].reduce((a,b)=>a+b)}/3`;b.onclick=()=>openLv(i);e.append(b)});$('bm').textContent='Звук: '+(S.mute?'выкл':'вкл')}
function hit(){const s=sz()/2;for(const q of O){if(q.t!='b'||q.x>P.x+s+5||q.x+q.w<P.x-s-5)continue;if(P.x+s>q.x&&P.x-s<q.x+q.w&&P.y+s>q.y&&P.y-s<q.y+q.h)return q}return 0}
function die(){state='dead';dead=.8;music(false);const p=Math.min(99.9,P.x/LV[lvl].len*100);if(p>S.best[lvl])S.best[lvl]=Math.floor(p);save();
 for(let i=0;i<26;i++){const a=Math.random()*6.28,v=100+Math.random()*320;parts.push({x:P.x,y:P.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:3+Math.random()*7})}}
function step(d){
 const s=sz()/2;let sn=0;
 if(mode=='cube'){P.vy+=2600*d;if(P.hold&&P.on){P.vy=-720;P.on=false}}
 else if(mode=='ship')P.vy=cl(P.vy+(P.hold?-1700:1300)*d,-400,400);
 else if(mode=='wave')P.vy=P.hold?-SP:SP;
 else P.vy=cl(P.vy+2300*P.dir*d,-480,480);
 P.x+=SP*d;
 for(let k=0,q;k<3&&(q=hit());k++){
  const pt=P.y+s-q.y,pb=q.y+q.h-(P.y-s);
  if((mode=='cube'||mode=='ship')&&pt<=12&&pt<pb){P.y=q.y-s;P.vy=0;P.on=true;sn=1}
  else if(mode=='ship'&&pb<=12){P.y=q.y+q.h+s;P.vy=Math.max(P.vy,0)}
  else return die();
 }
 if(!sn){P.y+=P.vy*d;P.on=false}
 const q=hit();
 if(q){if(mode=='wave'||mode=='swing'||(mode=='cube'&&P.vy<0))return die();
  if(P.vy>=0){P.y=q.y-s;P.vy=0;P.on=true}else{P.y=q.y+q.h+s;P.vy=0}}
 if(P.y+s>=FY){P.y=FY-s;P.vy=0;P.on=true}
 if(mode!='cube'&&P.y-s<0){P.y=s;if(P.vy<0)P.vy=0}
 const l=P.x-s,r=P.x+s,t=P.y-s,b=P.y+s;
 for(const o of O){
  if(o.x>r+50||o.x<l-50)continue;
  if(o.t=='s'&&r>o.x+13&&l<o.x+27&&b>o.y+12&&t<o.y+40)return die();
  if(o.t=='p'&&!o.d&&P.x>=o.x){o.d=1;setMode(o.m)}
  if(o.t=='c'&&!o.d&&Math.hypot(P.x-o.x,P.y-o.y)<s+16)o.d=1;
 }
 if(mode=='cube'){if(P.on)P.rot=Math.round(P.rot/(Math.PI/2))*Math.PI/2;else P.rot+=6*d}
 else if(mode=='ship')P.rot=Math.atan2(P.vy,SP)*.8;
 else if(mode=='wave'){P.rot=Math.atan2(P.vy,SP);P.trail.push([P.x,P.y]);if(P.trail.length>40)P.trail.shift()}
 if(P.x>=LV[lvl].len-40){state='win';S.best[lvl]=100;O.forEach(q=>{if(q.t=='c'&&q.d)S.cl[lvl][q.i]=1});save();music(false);$('et').textContent=`${LV[lvl].name}: попыток ${att}, монеты ${S.cl[lvl].reduce((a,b)=>a+b)}/3`;$('end').classList.remove('hid')}
}
function icon(c,s){
 c.fillStyle=COLS[S.c1];c.fillRect(-s/2,-s/2,s,s);c.strokeStyle='#000';c.lineWidth=2;c.strokeRect(-s/2,-s/2,s,s);c.fillStyle=COLS[S.c2];
 switch(S.ic){
  case 0:c.fillRect(-s*.3,-s*.2,s*.2,s*.25);c.fillRect(s*.1,-s*.2,s*.2,s*.25);c.fillRect(-s*.3,s*.18,s*.6,s*.12);break;
  case 1:c.fillRect(-s*.28,-s*.28,s*.56,s*.56);break;
  case 2:c.fillRect(-s*.1,-s*.4,s*.2,s*.8);c.fillRect(-s*.4,-s*.1,s*.8,s*.2);break;
  case 3:c.beginPath();c.moveTo(-s/2,s/2);c.lineTo(-s/2,s*.1);c.lineTo(s*.1,-s/2);c.lineTo(s/2,-s/2);c.lineTo(s/2,-s*.1);c.lineTo(-s*.1,s/2);c.fill();break;
  case 4:c.beginPath();c.arc(0,0,s*.3,0,7);c.fill();break;
  case 5:c.beginPath();c.moveTo(0,-s*.35);c.lineTo(s*.35,s*.3);c.lineTo(-s*.35,s*.3);c.fill();break;
  case 6:c.lineWidth=3;c.strokeStyle=COLS[S.c2];c.beginPath();c.arc(0,0,s*.3,0,7);c.stroke();break;
  case 7:for(let k=-1;k<=1;k++)c.fillRect(-s*.4,k*s*.28-s*.07,s*.8,s*.14);break;
  case 8:c.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,r=k%2?s*.15:s*.36;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.fill();break;
 }
}
function drawP(c,m,rot,sc,dir=1){
 c.save();c.rotate(rot);c.scale(sc,sc*(m=='swing'?dir:1));
 if(m=='cube')icon(c,34);
 else if(m=='ship'){c.fillStyle=COLS[S.c2];c.beginPath();c.moveTo(-24,2);c.lineTo(26,2);c.lineTo(16,14);c.lineTo(-18,14);c.closePath();c.fill();c.strokeStyle='#000';c.lineWidth=2;c.stroke();c.save();c.translate(2,-8);icon(c,22);c.restore()}
 else if(m=='wave'){c.fillStyle=COLS[S.c1];c.beginPath();c.moveTo(16,0);c.lineTo(-12,-12);c.lineTo(-5,0);c.lineTo(-12,12);c.closePath();c.fill();c.strokeStyle=COLS[S.c2];c.lineWidth=3;c.stroke()}
 else{icon(c,28);const w=40*Math.abs(Math.cos(NOW*20));c.fillStyle=COLS[S.c2];c.fillRect(-w/2,-24,w,4);c.fillRect(-2,-20,4,6)}
 c.restore();
}
function draw(){
 const L=LV[state=='menu'?0:lvl],cx=state=='menu'?NOW*120:P.x-200;
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,L.bg[0]);gr.addColorStop(1,L.bg[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.07)';
 for(let i=0;i<9;i++){const x=((i*190-cx*.3)%1000+1000)%1000-150;g.fillRect(x,40+(i*53)%240,90,90)}
 g.save();g.translate(-cx,0);
 g.fillStyle=L.gr;g.fillRect(cx,FY,W,H-FY);g.fillStyle=L.acc;g.fillRect(cx,FY,W,3);
 if(state!='menu'){
  for(const q of O){
   if(q.x+(q.w||T)<cx||q.x>cx+W)continue;
   if(q.t=='b'){g.fillStyle=L.blk;g.fillRect(q.x,q.y,q.w,q.h);g.strokeStyle=L.acc;g.lineWidth=2;g.strokeRect(q.x+1,q.y+1,q.w-2,q.h-2)}
   else if(q.t=='s'){g.fillStyle='#000';g.strokeStyle=L.acc;g.lineWidth=2;g.beginPath();g.moveTo(q.x+4,q.y+40);g.lineTo(q.x+36,q.y+40);g.lineTo(q.x+20,q.y);g.closePath();g.fill();g.stroke()}
   else if(q.t=='c'){if(!q.d){const w=Math.abs(Math.cos(NOW*4+q.i))*11+3;g.globalAlpha=S.cl[lvl][q.i]?.4:1;g.fillStyle='#ffd23a';g.strokeStyle='#8a5a00';g.lineWidth=3;g.beginPath();g.ellipse(q.x,q.y,w,13,0,0,7);g.fill();g.stroke();g.fillStyle='#fff6b0';g.fillRect(q.x-1.5,q.y-6,3,12);g.globalAlpha=1}}else if(q.t=='p'){g.fillStyle=PC[q.m];g.globalAlpha=.3;g.fillRect(q.x-12,0,36,FY);g.globalAlpha=1;g.fillRect(q.x+4,0,4,FY);g.font='bold 14px system-ui';g.textAlign='center';g.fillText(PN[q.m],q.x+6,180);g.textAlign='left'}
   else{g.fillStyle='#fff';for(let i=0;i<9;i++)g.fillRect(q.x+(i%2)*20,i*40,20,20);g.fillStyle='#000';for(let i=0;i<9;i++)g.fillRect(q.x+((i+1)%2)*20,i*40,20,20)}
  }
  if(state=='dead'){g.fillStyle=COLS[S.c1];for(const p of parts)g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  else{
   if(mode=='wave'&&P.trail.length>1){g.strokeStyle=COLS[S.tr];g.lineWidth=7;g.lineJoin='round';g.beginPath();P.trail.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()}
   g.save();g.translate(P.x,P.y);g.shadowColor=COLS[S.tr];g.shadowBlur=14;drawP(g,mode,P.rot,1,P.dir);g.restore();
  }
 }
 g.restore();
 if(state!='menu'){
  const p=Math.min(100,P.x/L.len*100);
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(150,12,500,10);g.fillStyle=L.acc;g.fillRect(150,12,5*p,10);
  g.fillStyle='#fff';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(`${L.name}  ·  ${p|0}%  ·  попытка ${att}`,400,42);g.textAlign='left';for(let i=0;i<3;i++){const got=S.cl[lvl][i]||O.some(q=>q.t=='c'&&q.i==i&&q.d);g.fillStyle=got?'#ffd23a':'rgba(255,255,255,.25)';g.beginPath();g.arc(20+i*22,20,8,0,7);g.fill()}
 }
}
function loop(ts){
 const d=Math.min(.05,(ts-last)/1000||0);last=ts;NOW=ts/1000;
 if(state=='play'){acc+=d;while(acc>=1/120&&state=='play'){step(1/120);acc-=1/120}}
 else if(state=='dead'){dead-=d;for(const p of parts){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=900*d}if(dead<=0)start()}
 draw();requestAnimationFrame(loop);
}
const dn=()=>{if(state!='play')return;P.hold=true;if(mode=='swing')P.dir=-P.dir},up=()=>{if(P)P.hold=false};
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)dn()}if(e.code=='Escape'&&state!='menu')toMenu()});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))up()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();dn()});addEventListener('pointerup',up);
$('bx').onclick=toMenu;$('bn').onclick=toMenu;$('br').onclick=()=>{$('end').classList.add('hid');openLv(lvl)};
$('bm').onclick=()=>{S.mute=S.mute?0:1;save();$('bm').textContent='Звук: '+(S.mute?'выкл':'вкл')};
$('bc').onclick=()=>{$('menu').classList.add('hid');$('cust').classList.remove('hid');cust()};
$('bk').onclick=()=>{$('cust').classList.add('hid');$('menu').classList.remove('hid')};
function cust(){
 const ig=$('ig');ig.innerHTML='';const old=S.ic;$('cm').textContent='Секретных монет: '+tot()+'/9. Иконки с замком открываются за монеты.';
 for(let i=0;i<9;i++){const k=document.createElement('canvas');k.width=k.height=48;S.ic=i;const c=k.getContext('2d');c.translate(24,24);icon(c,32);S.ic=old;const lk=tot()<NEED[i];if(lk){c.fillStyle='rgba(5,6,22,.82)';c.fillRect(-24,-24,48,48);c.fillStyle='#ffd23a';c.font='bold 15px system-ui';c.textAlign='center';c.fillText(NEED[i]+' ●',0,5)}k.className=old==i?'on':'';k.onclick=()=>{if(lk){$('cm').textContent='Откроется за '+NEED[i]+' монет (у тебя '+tot()+')';return}S.ic=i;save();cust()};ig.append(k)}
 for(const[id,key]of[['s1','c1'],['s2','c2'],['s3','tr']]){const e=$(id);e.innerHTML='';COLS.forEach((col,i)=>{const s=document.createElement('i');s.style.background=col;s.className=S[key]==i?'on':'';s.onclick=()=>{S[key]=i;save();cust()};e.append(s)})}
 const c=$('pv').getContext('2d');c.clearRect(0,0,480,110);
 [['cube',60,0],['ship',180,-.15],['wave',300,-.6],['swing',420,0]].forEach(([m,x,r])=>{c.save();c.translate(x,55);if(m=='wave'){c.strokeStyle=COLS[S.tr];c.lineWidth=8;c.beginPath();c.moveTo(-55,35);c.lineTo(-25,5);c.stroke()}drawP(c,m,r,1.4);c.restore()});
}
/* Музыка: процедурная, у каждого уровня свой трек */
let AC,mg,NB,sch,nt,si=0,tk;
const NOTE=m=>440*2**((m-69)/12);
function tone(t,f,du,ty,v){const o=AC.createOscillator(),e=AC.createGain();o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+du);o.connect(e);e.connect(mg);o.start(t);o.stop(t+du+.02)}
function kick(t){const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);e.gain.setValueAtTime(.9,t);e.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(e);e.connect(mg);o.start(t);o.stop(t+.22)}
function noise(t,du,v,hp){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const e=AC.createGain();e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+du);s.connect(f);f.connect(e);e.connect(mg);s.start(t);s.stop(t+du)}
function play(i,t){
 const bar=(i>>4)%tk.prog.length,s=i&15,deg=tk.prog[bar],sec=60/tk.bpm/4;
 const nn=d=>tk.root+tk.sc[((d%7)+7)%7]+12*Math.floor(d/7);
 if(tk.k[s]=='x')kick(t);
 if(s==4||s==12)noise(t,.15,.35,1500);
 if(s%2==1||tk.bpm>145)noise(t,.04,.12,7000);
 if(tk.b[s]=='x')tone(t,NOTE(nn(deg)-24),sec*1.6,'sawtooth',.16);
 const ch=tk.l[(i>>4)&1][s];if(ch!='.'){tone(t,NOTE(nn(deg+ +ch)+12),sec*1.8,'square',.06);tone(t,NOTE(nn(deg+ +ch)+12.1),sec*1.8,'triangle',.05)}
 if(s==0)[0,2,4].forEach(o=>tone(t,NOTE(nn(deg+o)),sec*15,'triangle',.05));
}
function music(on){
 clearInterval(sch);if(!on||S.mute)return;
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  mg=AC.createGain();mg.gain.value=.55;mg.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 AC.resume();tk=LV[lvl].m;si=0;nt=AC.currentTime+.1;
 sch=setInterval(()=>{while(nt<AC.currentTime+.25){play(si++,nt);nt+=60/tk.bpm/4}},50);
}
